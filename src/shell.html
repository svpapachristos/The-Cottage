<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0618">
<title>The Cottage</title>
<!--PWA-->
<style>
@font-face { font-family: "m5x7"; src: url(data:font/ttf;base64,FONT_B64) format("truetype"); }
:root { --bg: #0c0618; --panel: #150c27; --panel2: #1f1336; --line: #34234f; --lilac: #dc5aff; --pink: #ff7ad9; --dim: #a796c8; --text: #ffe1fa; --mint: #9fe6d0; --gold: #ffd070; --ice: #8ac0e8; --peach: #ffb38a; --ember: #ff9a50; --page: #1a0f2e; --ink: #f3dcff; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { overflow-x: hidden; background: radial-gradient(ellipse at 50% -10%, #241240 0%, var(--bg) 60%) fixed; }
body.night { background: radial-gradient(ellipse at 50% -10%, #120a22 0%, #06030c 60%) fixed; }
.px { font-family: "m5x7", monospace; -webkit-font-smoothing: none; line-height: 1; font-weight: normal; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
#app { max-width: 1100px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 130px calc(16px + env(safe-area-inset-left)); }
header { display: flex; align-items: center; gap: 10px; padding: 2px 0 8px; }
#logo { width: 40px; height: 40px; flex: none; cursor: pointer; }
.brand { cursor: pointer; min-width: 0; }
.brand h1 { white-space: nowrap; }
h1 { font-size: 40px; margin: 0; letter-spacing: 1px; }
.sub { color: var(--dim); font-size: 14px; }
.spacer { flex: 1; }
.iconbtn { background: var(--panel); border: 1.5px solid var(--line); color: var(--text); border-radius: 10px; width: 42px; height: 42px; display: grid; place-items: center; cursor: pointer; padding: 0; }
.iconbtn:hover { border-color: var(--lilac); }
.iconbtn img { width: 24px; height: 24px; image-rendering: pixelated; }
button { font: inherit; font-size: 14px; color: var(--text); background: var(--panel2); border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--lilac); }
button:disabled { opacity: .6; cursor: default; }
button.main { background: var(--lilac); color: var(--bg); border-color: var(--lilac); font-weight: 600; }
button.ghost { background: none; border-color: transparent; color: var(--lilac); padding: 4px 6px; }
button.danger { color: #ff9a80; }
button.ember { color: var(--ember); border-color: #6a3a2a; }
input[type=text], input[type=url], input[type=search], input[type=password], select, textarea { background: var(--panel2); color: var(--text); border: 1.5px solid var(--line); border-radius: 8px; font: inherit; font-size: 15px; padding: 7px 9px; outline: none; max-width: 100%; }
input:focus, select:focus, textarea:focus { border-color: var(--lilac); }
textarea { width: 100%; resize: vertical; }
.banner { background: #2a1430; border: 1.5px solid #6a3a6a; border-radius: 8px; padding: 8px 12px; font-size: 14px; margin: 4px 0 10px; }
.crumbs { font-size: 14px; color: var(--dim); margin: 4px 0 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.crumbs a { color: var(--lilac); text-decoration: none; cursor: pointer; }
.crumbs span.sep { color: #5a4a78; }
.card { background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.lbl { font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-size: 22px; color: var(--pink); margin: 0 0 6px; display: flex; align-items: center; gap: 6px; }
.lbl img { width: 16px; height: 16px; image-rendering: pixelated; }
.lbl .c { color: var(--dim); font-size: 16px; }
.lbl .r { margin-left: auto; font-family: system-ui, sans-serif; font-size: 13px; }
/* home */
.home { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: start; }
.left { display: flex; flex-direction: column; gap: 0; align-items: center; }
.house { position: relative; margin: 0 auto; transition: transform .28s ease-in, opacity .28s ease-in; }
.house.zoom { opacity: 0; }
.road { position: relative; margin: 0 auto; }
.hot { position: absolute; background: none; border: none; padding: 0; border-radius: 2px; cursor: pointer; }
.hot:hover, .hot:focus-visible { outline: none; }
.hot .lab { position: absolute; left: 3px; bottom: 3px; font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-size: 16px; line-height: 1; padding: 2px 5px 3px; background: rgba(12,6,24,0.78); border-radius: 4px; color: var(--text); white-space: nowrap; }
.hot .bad { position: absolute; right: 3px; top: 3px; display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; }
.chipn { font: 600 11px/1 system-ui, sans-serif; padding: 3px 6px; border-radius: 999px; background: rgba(12,6,24,0.8); color: var(--text); border: 1px solid var(--lilac); white-space: nowrap; }
.chipn.q { border-color: var(--pink); color: var(--pink); }
.chipn.new { border-color: var(--gold); color: var(--gold); }
.chipn.rune { border-color: var(--mint); color: var(--mint); }
.stone { position: absolute; background: none; border: none; padding: 0; cursor: pointer; border-radius: 3px; }
.stone:hover, .stone:focus-visible { outline: 1px solid var(--text); outline-offset: 1px; }
.today { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.munin { display: flex; gap: 12px; align-items: flex-end; }
.munin canvas { width: 72px; height: 72px; flex: none; cursor: pointer; border-radius: 50%; background: radial-gradient(circle at 50% 55%, #3a2266 0%, #22143e 55%, transparent 72%); padding: 4px; }
.bubble { position: relative; background: #241540; border: 1.5px solid #5a3a8a; border-radius: 14px 14px 14px 4px; padding: 10px 14px; font-size: 15.5px; flex: 1; min-width: 0; cursor: pointer; }
.bubble:hover { border-color: var(--lilac); }
.bubble .hi { font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-size: 26px; line-height: 1; display: block; margin-bottom: 4px; color: var(--text); }
.bubble .go { color: var(--lilac); font-size: 13px; display: block; margin-top: 4px; }
.pickbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.close-btn { width: 100%; padding: 12px; font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-size: 24px; line-height: 1; background: #1a0e2c; border-color: #4a2a6a; color: var(--gold); display: flex; align-items: center; justify-content: center; gap: 10px; }
.close-btn canvas { width: 24px; height: 24px; }
.sending .row { display: flex; gap: 8px; align-items: baseline; font-size: 14px; padding: 3px 0; }
.sending .row .k { color: var(--dim); min-width: 62px; font-size: 13px; }
.lant { color: var(--gold); }
/* items */
.it { border-radius: 8px; }
.it + .it { border-top: 1px solid #1e1434; }
.ih { display: flex; gap: 10px; align-items: flex-start; padding: 8px 6px; cursor: pointer; border-radius: 8px; }
.ih:hover { background: #1b1030; }
.pi { width: 16px; height: 16px; flex: none; margin-top: 2px; image-rendering: pixelated; }
.ih .t { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 15px; }
.ih .m { color: var(--dim); font-size: 12px; white-space: nowrap; margin-top: 2px; }
.ih .where { color: var(--dim); font-size: 12px; display: block; }
.tag { font: 600 10.5px/1 system-ui, sans-serif; border-radius: 999px; padding: 2px 6px; margin-left: 4px; vertical-align: 2px; border: 1px solid; white-space: nowrap; }
.tag.tday { color: var(--gold); border-color: #8a6a20; }
.tag.twk { color: var(--ice); border-color: #3a5a7a; }
.tag.new { color: var(--gold); border-color: #8a6a20; }
.it.done .ih .t { color: var(--dim); text-decoration: line-through; }
.pin { color: var(--gold); }
.chk { flex: none; width: 20px; height: 20px; padding: 0; border-radius: 5px; border: 2px solid var(--lilac); background: transparent; margin-top: 1px; position: relative; }
.chk.on { background: var(--lilac); }
.chk.on::after { content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid var(--bg); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
.ib { display: none; padding: 0 8px 10px 32px; }
.it.open .ib { display: block; }
.body { font-size: 14.5px; color: #e9d6f2; line-height: 1.55; overflow-wrap: anywhere; }
.body p { margin: 0 0 6px; } .body ul, .body ol { margin: 2px 0 6px; padding-left: 20px; }
.body code { background: #24163c; border-radius: 4px; padding: 1px 4px; font-size: .92em; }
.body a { color: var(--lilac); }
.ibm { color: var(--dim); font-size: 12px; margin: 6px 0; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.acts button, .acts a { font-size: 13px; padding: 4px 10px; }
a.play { display: inline-block; color: var(--bg); background: var(--mint); border-radius: 7px; padding: 4px 10px; text-decoration: none; font-weight: 600; font-size: 13px; }
.answer { display: flex; gap: 6px; margin-top: 6px; }
.answer input { flex: 1; }
.empty { color: var(--dim); font-size: 14px; padding: 4px 6px; }
.addline { display: flex; gap: 6px; margin-top: 6px; }
.addline input { flex: 1; font-size: 14px; padding: 6px 9px; background: transparent; border-style: dashed; }
.more { color: var(--lilac); font-size: 13px; cursor: pointer; background: none; border: none; padding: 4px 6px; }
/* room, project and page views */
.scene { display: block; margin: 0 auto 10px; border-radius: 10px; border: 2px solid var(--line); max-width: 100%; }
.ptitle { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.ptitle h2 { font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-weight: normal; font-size: 44px; margin: 0; line-height: 1; }
.ver { color: var(--gold); font-size: 14px; border: 1px solid #8a6a20; border-radius: 999px; padding: 1px 8px; }
.trailtag { color: var(--mint); font-size: 13px; border: 1px solid #3a7a6a; border-radius: 999px; padding: 1px 8px; }
.stand { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 15px; margin-top: 8px; }
.stand b { color: var(--dim); font-weight: 500; font-size: 13px; padding-top: 2px; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 14px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.book { cursor: pointer; display: flex; gap: 10px; align-items: stretch; padding: 10px 12px 10px 10px; transition: transform .12s, border-color .12s; }
.book:hover { border-color: var(--lilac); transform: translateY(-2px); }
.spine { width: 14px; flex: none; border-radius: 3px; image-rendering: pixelated; }
.bk { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.bk .n { font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-size: 26px; line-height: .9; }
.bk .s { font-size: 13px; color: var(--dim); }
.bk .nx { font-size: 13px; }
.bk .nx b { color: var(--pink); font-weight: 600; }
.bk .f { display: flex; gap: 6px; align-items: center; margin-top: auto; flex-wrap: wrap; }
h3.sec { font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-weight: normal; font-size: 28px; margin: 20px 0 8px; display: flex; align-items: center; gap: 10px; }
h3.sec .r { margin-left: auto; font: 14px system-ui, sans-serif; }
.pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.pagecard { cursor: pointer; background: var(--page); border: 1.5px solid #3e2a5e; border-radius: 4px 12px 12px 4px; border-left: 5px solid #5a3a8a; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; transition: transform .12s, border-color .12s; min-width: 0; }
.pagecard:hover { transform: translateY(-2px); border-color: var(--lilac); }
.pagecard .n { font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-size: 24px; line-height: .95; color: var(--ink); }
.pagecard .s { font-size: 13px; color: var(--dim); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.pagecard .w { font-size: 11.5px; color: #8a7aa8; margin-top: auto; }
/* a page, read like a grimoire */
.grim { background: var(--page); border: 2px solid #3e2a5e; border-radius: 6px 16px 16px 6px; border-left: 8px solid #4a2a6a; padding: 22px clamp(16px, 4vw, 44px) 30px; max-width: 860px; margin: 0 auto; }
.grim .gh { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; border-bottom: 1px dashed #4a3470; padding-bottom: 10px; margin-bottom: 14px; }
.grim .gh h2 { font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-weight: normal; font-size: 46px; margin: 0; line-height: .95; color: var(--ink); flex: 1 1 300px; }
.doc { font-size: 16px; line-height: 1.65; color: var(--ink); overflow-wrap: anywhere; }
.doc h1, .doc h2, .doc h3, .doc h4 { font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-weight: normal; line-height: 1; color: var(--pink); margin: 22px 0 8px; }
.doc h1 { font-size: 40px; } .doc h2 { font-size: 34px; } .doc h3 { font-size: 28px; color: var(--lilac); } .doc h4 { font-size: 24px; color: var(--lilac); }
.doc p { margin: 0 0 10px; } .doc ul, .doc ol { margin: 0 0 10px; padding-left: 24px; } .doc li { margin: 2px 0; }
.doc a { color: var(--lilac); }
.doc code { background: #2a1a44; border-radius: 4px; padding: 1px 5px; font-size: .9em; }
.doc pre { background: #120a20; border: 1px solid #34234f; border-radius: 8px; padding: 10px 12px; overflow: auto; font-size: 13.5px; line-height: 1.45; }
.doc pre code { background: none; padding: 0; }
.doc blockquote { margin: 0 0 10px; padding: 4px 14px; border-left: 3px solid var(--pink); color: #e8c8f0; }
.doc hr { border: none; border-top: 1px dashed #4a3470; margin: 18px 0; }
.doc .tw { overflow-x: auto; margin: 0 0 12px; }
.doc table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
.doc th, .doc td { border: 1px solid #3e2a5e; padding: 6px 9px; text-align: left; vertical-align: top; overflow-wrap: normal; word-break: normal; min-width: 5.5em; }
.doc td:first-child, .doc th:first-child { min-width: 2.5em; }
.doc th { background: #24163c; color: var(--pink); font-weight: 600; }
.doc .cb { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--lilac); border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
.doc .cb.on { background: var(--lilac); }
/* the book of shadows */
.bos { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); background: #120a20; border: 2px solid #4a2a6a; border-radius: 18px; padding: 10px; gap: 0; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.bos::before { content: ""; position: absolute; left: 50%; top: 10px; bottom: 10px; width: 2px; background: #3a2058; transform: translateX(-1px); }
.leaf { background: var(--page); padding: 16px 18px 20px; min-height: 360px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.leaf.l { border-radius: 12px 2px 2px 12px; }
.leaf.r { border-radius: 2px 12px 12px 2px; }
.leaf h3 { margin: 0; font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-weight: normal; font-size: 32px; color: var(--ink); line-height: 1; }
.leaf textarea { background: #22143a; border-color: #3e2a5e; min-height: 140px; font-size: 16px; }
.rune { border: 1.5px solid #3e2a5e; border-radius: 10px; padding: 10px 12px; background: #1f1236; }
.rune + .rune { margin-top: 10px; }
.rune .t { font-size: 15.5px; color: var(--ink); overflow-wrap: anywhere; }
.rune .file { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
.rune .file select { font-size: 13px; padding: 5px 6px; max-width: 46%; }
.rune .sug { color: var(--mint); font-size: 12.5px; margin-top: 6px; }
.rune .from { color: var(--gold); font-size: 12px; margin-top: 4px; }
/* the brain badge: which brain is answering */
.brain { display: inline-flex; align-items: center; gap: 4px; font: 12px/1 system-ui, sans-serif; padding: 3px 8px; border-radius: 999px; border: 1px solid; white-space: nowrap; vertical-align: middle; cursor: help; }
.brain img.pi { width: 12px; height: 12px; }
.brain.hearth { color: var(--ember); border-color: #7a4a28; background: rgba(255,154,80,.08); }
.brain.claude { color: var(--gold); border-color: #8a6a20; background: rgba(255,208,112,.06); }
.brain.code { color: var(--dim); border-color: var(--line); }
.brainrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--dim); }
.a > .brain { display: flex; width: max-content; margin-bottom: 6px; }
.flyer { position: fixed; z-index: 40; width: 48px; height: 36px; pointer-events: none; }
/* floating buttons */
.fabs { position: fixed; right: calc(20px + env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; z-index: 15; }
.fab { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--lilac); background: #2a1a4a; display: grid; place-items: center; padding: 0; box-shadow: 0 6px 18px rgba(0,0,0,.45); cursor: pointer; }
.fab:hover { transform: scale(1.06); }
.fab canvas, .fab img { width: 40px; height: 40px; image-rendering: pixelated; }
.fab.add { background: var(--lilac); }
.fab.add img { width: 30px; height: 30px; }
/* sheets */
.veil { position: fixed; inset: 0; background: rgba(5,0,12,0.7); z-index: 20; display: none; }
.veil.open { display: block; }
.sheet { position: fixed; z-index: 21; background: var(--panel); border: 2px solid var(--lilac); display: none; flex-direction: column; gap: 10px; padding: 16px; overflow: auto;
  right: 16px; top: calc(16px + env(safe-area-inset-top)); bottom: 16px; width: min(480px, calc(100% - 32px)); border-radius: 14px; }
.sheet.wide { width: min(820px, calc(100% - 32px)); }
.sheet.open { display: flex; }
.sheet h3 { margin: 0; font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-weight: normal; font-size: 34px; display: flex; align-items: center; gap: 10px; line-height: 1; }
.sheet label { font-size: 12.5px; color: var(--dim); display: flex; flex-direction: column; gap: 4px; }
.sheet .line { display: flex; gap: 8px; flex-wrap: wrap; }
.sheet .line > * { flex: 1 1 140px; }
.sheet input[type=text], .sheet input[type=url], .sheet input[type=search], .sheet select { width: 100%; }
.sheet textarea.big { min-height: 46vh; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 13.5px; line-height: 1.5; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 14px/1 system-ui, sans-serif; color: var(--dim); background: var(--panel2); border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 12px; cursor: pointer; }
.chip.on { color: var(--bg); background: var(--lilac); border-color: var(--lilac); }
.checks { display: flex; gap: 16px; flex-wrap: wrap; }
.checks label { flex-direction: row; align-items: center; color: var(--text); font-size: 14px; gap: 6px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.res { cursor: pointer; padding: 8px 6px; border-radius: 8px; display: flex; gap: 10px; align-items: flex-start; }
.res:hover, .res.sel { background: #22143c; }
.res img { width: 16px; height: 16px; image-rendering: pixelated; margin-top: 2px; }
.res .t { font-size: 15px; } .res .w { font-size: 12px; color: var(--dim); }
mark { background: color-mix(in srgb, var(--gold) 35%, transparent); color: inherit; border-radius: 3px; }
.mhead { display: flex; gap: 14px; align-items: center; }
.mhead canvas { width: 88px; height: 88px; flex: none; border-radius: 50%; background: radial-gradient(circle at 50% 55%, #3a2266 0%, #22143e 55%, transparent 72%); padding: 6px; }
.mhead .say { font-size: 15.5px; }
.mgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.mgrid button { text-align: left; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.mgrid button b { font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-weight: normal; font-size: 22px; line-height: 1; color: var(--text); }
.mgrid button span { font-size: 12.5px; color: var(--dim); }
#askLog { display: flex; flex-direction: column; gap: 10px; flex: 1; }
.q { align-self: flex-end; background: var(--panel2); border-radius: 12px 12px 2px 12px; padding: 8px 12px; max-width: 88%; white-space: pre-wrap; font-size: 15px; }
.a { background: #1a1030; border: 1.5px solid var(--line); border-radius: 12px 12px 12px 2px; padding: 10px 14px; font-size: 15px; line-height: 1.5; }
.a p { margin: 0 0 8px; } .a p:last-child { margin: 0; } .a ul, .a ol { margin: 4px 0; padding-left: 20px; }
.ref { display: inline-block; color: var(--gold); border: 1px solid #8a6a20; border-radius: 999px; padding: 0 7px; font-size: 13px; cursor: pointer; margin: 0 1px; }
.ref:hover { background: #2a1e10; }
