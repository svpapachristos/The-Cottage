:root { --bg: #0c0618; --panel: #150c27; --panel2: #1f1336; --line: #34234f; --lilac: #dc5aff; --pink: #ff7ad9; --dim: #a796c8; --text: #ffe1fa; --mint: #9fe6d0; --gold: #ffd070; --ice: #8ac0e8; --peach: #ffb38a; --ember: #ff9a50; --page: #1a0f2e; --ink: #f3dcff; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { overflow-x: hidden; background: radial-gradient(ellipse at 50% -10%, #241240 0%, var(--bg) 60%) fixed; }
body.night { background: radial-gradient(ellipse at 50% -10%, #120a22 0%, #06030c 60%) fixed; }
.px { font-family: "m5x7", monospace; -webkit-font-smoothing: none; line-height: 1; font-weight: normal; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
#app { max-width: 1100px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 150px calc(16px + env(safe-area-inset-left)); }
header { display: flex; align-items: center; gap: 10px; padding: 2px 0 8px; }
#logo { width: 40px; height: 40px; flex: none; cursor: pointer; }
.brand { cursor: pointer; min-width: 0; }
.brand h1 { white-space: nowrap; }
h1 { font-size: 40px; margin: 0; letter-spacing: 1px; }
.sub { color: var(--dim); font-size: 14px; }
.spacer { flex: 1; }
.iconbtn { background: var(--panel); border: 1.5px solid var(--line); color: var(--text); border-radius: 10px; width: 42px; height: 42px; display: grid; place-items: center; cursor: pointer; padding: 0; }
.iconbtn:hover { border-color: var(--lilac); }
.iconbtn img { width: 24px; height: 24px; image-rendering: pixelated; }
button { font: inherit; font-size: 14px; color: var(--text); background: var(--panel2); border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--lilac); }
button:disabled { opacity: .6; cursor: default; }
button.main { background: var(--lilac); color: var(--bg); border-color: var(--lilac); font-weight: 600; }
button.ghost { background: none; border-color: transparent; color: var(--lilac); padding: 4px 6px; }
button.danger { color: #ff9a80; }
button.ember { color: var(--ember); border-color: #6a3a2a; }
input[type=text], input[type=url], input[type=search], input[type=password], select, textarea { background: var(--panel2); color: var(--text); border: 1.5px solid var(--line); border-radius: 8px; font: inherit; font-size: 15px; padding: 7px 9px; outline: none; max-width: 100%; }
input:focus, select:focus, textarea:focus { border-color: var(--lilac); }
textarea { width: 100%; resize: vertical; }
.banner { background: #2a1430; border: 1.5px solid #6a3a6a; border-radius: 8px; padding: 8px 12px; font-size: 14px; margin: 4px 0 10px; }
.crumbs { font-size: 14px; color: var(--dim); margin: 4px 0 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.crumbs a { color: var(--lilac); text-decoration: none; cursor: pointer; }
.crumbs span.sep { color: #5a4a78; }
.card { background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.lbl { font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-size: 22px; color: var(--pink); margin: 0 0 6px; display: flex; align-items: center; gap: 6px; }
.lbl img { width: 16px; height: 16px; image-rendering: pixelated; }
.lbl .c { color: var(--dim); font-size: 16px; }
.lbl .r { margin-left: auto; font-family: system-ui, sans-serif; font-size: 13px; }
/* home */
.home { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: start; }
.home > .left { grid-column: 1; grid-row: 1; }
.homecol { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.houselinks { display: flex; gap: 8px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
.houselinks button { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
.capture textarea { width: 100%; min-height: 64px; resize: vertical; font-size: 16px; background: #1c1132; }
.caprow { display: flex; align-items: center; gap: 10px; justify-content: space-between; margin-top: 8px; flex-wrap: wrap; }
.caprow .sub a { color: var(--mint); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.caprow .main { margin-left: auto; }
.left { display: flex; flex-direction: column; gap: 0; align-items: center; }
.house { position: relative; margin: 0 auto; transition: transform .28s ease-in, opacity .28s ease-in; }
.house.zoom { opacity: 0; }
.road { position: relative; margin: 0 auto; }
.hot { position: absolute; background: none; border: none; padding: 0; border-radius: 2px; cursor: pointer; }
.hot:hover, .hot:focus-visible { outline: none; }
.hot .lab { position: absolute; left: 3px; bottom: 3px; font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-size: 16px; line-height: 1; padding: 2px 5px 3px; background: rgba(12,6,24,0.78); border-radius: 4px; color: var(--text); white-space: nowrap; }
.hot .bad { position: absolute; right: 3px; top: 3px; display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; }
.chipn { font: 600 11px/1 system-ui, sans-serif; padding: 3px 6px; border-radius: 999px; background: rgba(12,6,24,0.8); color: var(--text); border: 1px solid var(--lilac); white-space: nowrap; }
.chipn.q { border-color: var(--pink); color: var(--pink); }
.chipn.new { border-color: var(--gold); color: var(--gold); }
.chipn.rune { border-color: var(--mint); color: var(--mint); }
.stone { position: absolute; background: none; border: none; padding: 0; cursor: pointer; border-radius: 3px; }
.stone:hover, .stone:focus-visible { outline: 1px solid var(--text); outline-offset: 1px; }
.today { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.munin { display: flex; gap: 12px; align-items: flex-end; }
.munin canvas { width: 72px; height: 72px; flex: none; cursor: pointer; border-radius: 50%; background: radial-gradient(circle at 50% 55%, #3a2266 0%, #22143e 55%, transparent 72%); padding: 4px; }
.bubble { position: relative; background: #241540; border: 1.5px solid #5a3a8a; border-radius: 14px 14px 14px 4px; padding: 10px 14px; font-size: 15.5px; flex: 1; min-width: 0; cursor: pointer; }
.bubble:hover { border-color: var(--lilac); }
.bubble .hi { font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-size: 26px; line-height: 1; display: block; margin-bottom: 4px; color: var(--text); }
.bubble .go { color: var(--lilac); font-size: 13px; display: block; margin-top: 4px; }
.pickbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.close-btn { width: 100%; padding: 12px; font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-size: 24px; line-height: 1; background: #1a0e2c; border-color: #4a2a6a; color: var(--gold); display: flex; align-items: center; justify-content: center; gap: 10px; }
.close-btn canvas { width: 24px; height: 24px; }
.sending .row { display: flex; gap: 8px; align-items: baseline; font-size: 14px; padding: 3px 0; }
.sending .row .k { color: var(--dim); min-width: 62px; font-size: 13px; }
.lant { color: var(--gold); }
/* items */
.it { border-radius: 8px; }
.it + .it { border-top: 1px solid #1e1434; }
.ih { display: flex; gap: 10px; align-items: flex-start; padding: 8px 6px; cursor: pointer; border-radius: 8px; }
.ih:hover { background: #1b1030; }
.pi { width: 16px; height: 16px; flex: none; margin-top: 2px; image-rendering: pixelated; }
.ih .t { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 15px; }
.ih .m { color: var(--dim); font-size: 12px; white-space: nowrap; margin-top: 2px; }
.ih .where { color: var(--dim); font-size: 12px; display: block; }
.tag { font: 600 10.5px/1 system-ui, sans-serif; border-radius: 999px; padding: 2px 6px; margin-left: 4px; vertical-align: 2px; border: 1px solid; white-space: nowrap; }
.tag.tday { color: var(--gold); border-color: #8a6a20; }
.tag.twk { color: var(--ice); border-color: #3a5a7a; }
.tag.new { color: var(--gold); border-color: #8a6a20; }
.it.done .ih .t { color: var(--dim); text-decoration: line-through; }
.pin { color: var(--gold); }
.chk { flex: none; width: 20px; height: 20px; padding: 0; border-radius: 5px; border: 2px solid var(--lilac); background: transparent; margin-top: 1px; position: relative; }
.chk.on { background: var(--lilac); }
.chk.on::after { content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid var(--bg); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
.ib { display: none; padding: 0 8px 10px 32px; }
.it.open .ib { display: block; }
.body { font-size: 14.5px; color: #e9d6f2; line-height: 1.55; overflow-wrap: anywhere; }
.body p { margin: 0 0 6px; } .body ul, .body ol { margin: 2px 0 6px; padding-left: 20px; }
.body code { background: #24163c; border-radius: 4px; padding: 1px 4px; font-size: .92em; }
.body a { color: var(--lilac); }
.ibm { color: var(--dim); font-size: 12px; margin: 6px 0; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.acts button, .acts a { font-size: 13px; padding: 4px 10px; }
a.play { display: inline-block; color: var(--bg); background: var(--mint); border-radius: 7px; padding: 4px 10px; text-decoration: none; font-weight: 600; font-size: 13px; }
.answer { display: flex; gap: 6px; margin-top: 6px; }
.answer input { flex: 1; }
.empty { color: var(--dim); font-size: 14px; padding: 4px 6px; }
.addline { display: flex; gap: 6px; margin-top: 6px; }
.addline input { flex: 1; font-size: 14px; padding: 6px 9px; background: transparent; border-style: dashed; }
.more { color: var(--lilac); font-size: 13px; cursor: pointer; background: none; border: none; padding: 4px 6px; }
/* room, project and page views */
.scene { display: block; margin: 0 auto 10px; border-radius: 10px; border: 2px solid var(--line); max-width: 100%; }
.ptitle { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.ptitle h2 { font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-weight: normal; font-size: 44px; margin: 0; line-height: 1; }
.ver { color: var(--gold); font-size: 14px; border: 1px solid #8a6a20; border-radius: 999px; padding: 1px 8px; }
.trailtag { color: var(--mint); font-size: 13px; border: 1px solid #3a7a6a; border-radius: 999px; padding: 1px 8px; }
.stand { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 15px; margin-top: 8px; }
.stand b { color: var(--dim); font-weight: 500; font-size: 13px; padding-top: 2px; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 14px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.book { cursor: pointer; display: flex; gap: 10px; align-items: stretch; padding: 10px 12px 10px 10px; transition: transform .12s, border-color .12s; }
.book:hover { border-color: var(--lilac); transform: translateY(-2px); }

.bk { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }

.bk .nx { font-size: 13px; }

h3.sec { font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-weight: normal; font-size: 28px; margin: 20px 0 8px; display: flex; align-items: center; gap: 10px; }

.pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.pagecard { cursor: pointer; background: var(--page); border: 1.5px solid #3e2a5e; border-radius: 4px 12px 12px 4px; border-left: 5px solid #5a3a8a; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; transition: transform .12s, border-color .12s; min-width: 0; }
.pagecard:hover { transform: translateY(-2px); border-color: var(--lilac); }
.pagecard .n { font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-size: 24px; line-height: .95; color: var(--ink); }
.pagecard .s { font-size: 13px; color: var(--dim); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.pagecard .w { font-size: 11.5px; color: #8a7aa8; margin-top: auto; }
/* a page, read like a grimoire */
.grim { background: var(--page); border: 2px solid #3e2a5e; border-radius: 6px 16px 16px 6px; border-left: 8px solid #4a2a6a; padding: 22px clamp(16px, 4vw, 44px) 30px; max-width: 860px; margin: 0 auto; }
.grim .gh { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; border-bottom: 1px dashed #4a3470; padding-bottom: 10px; margin-bottom: 14px; }
.grim .gh h2 { font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-weight: normal; font-size: 46px; margin: 0; line-height: .95; color: var(--ink); flex: 1 1 300px; }
.doc { font-size: 16px; line-height: 1.65; color: var(--ink); overflow-wrap: anywhere; }
.doc h1, .doc h2, .doc h3, .doc h4 { font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-weight: normal; line-height: 1; color: var(--pink); margin: 22px 0 8px; }
.doc h1 { font-size: 40px; } .doc h2 { font-size: 34px; } .doc h3 { font-size: 28px; color: var(--lilac); } .doc h4 { font-size: 24px; color: var(--lilac); }
.doc p { margin: 0 0 10px; } .doc ul, .doc ol { margin: 0 0 10px; padding-left: 24px; } .doc li { margin: 2px 0; }
.doc a { color: var(--lilac); }
.doc code { background: #2a1a44; border-radius: 4px; padding: 1px 5px; font-size: .9em; }
.doc pre { background: #120a20; border: 1px solid #34234f; border-radius: 8px; padding: 10px 12px; overflow: auto; font-size: 13.5px; line-height: 1.45; }

.doc hr { border: none; border-top: 1px dashed #4a3470; margin: 18px 0; }
.doc .tw { overflow-x: auto; margin: 0 0 12px; }
.doc table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
.doc th, .doc td { border: 1px solid #3e2a5e; padding: 6px 9px; text-align: left; vertical-align: top; overflow-wrap: normal; word-break: normal; min-width: 5.5em; }

.doc th { background: #24163c; color: var(--pink); font-weight: 600; }
.doc .cb { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--lilac); border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
.doc .cb.on { background: var(--lilac); }
/* the book of shadows */
.bos { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); background: #120a20; border: 2px solid #4a2a6a; border-radius: 18px; padding: 10px; gap: 0; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.bos::before { content: ""; position: absolute; left: 50%; top: 10px; bottom: 10px; width: 2px; background: #3a2058; transform: translateX(-1px); }
.leaf { background: var(--page); padding: 16px 18px 20px; min-height: 360px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.leaf.l { border-radius: 12px 2px 2px 12px; }
.leaf.r { border-radius: 2px 12px 12px 2px; }
.leaf h3 { margin: 0; font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-weight: normal; font-size: 32px; color: var(--ink); line-height: 1; }
.leaf textarea { background: #22143a; border-color: #3e2a5e; min-height: 140px; font-size: 16px; }
.rune { border: 1.5px solid #3e2a5e; border-radius: 10px; padding: 10px 12px; background: #1f1236; }

.inside { margin-top: 22px; border-top: 1.5px dashed #3a2a58; padding-top: 8px; }
.pagecard .w .inn { color: var(--mint); font-weight: 600; }
.rune .rhead { display: flex; gap: 10px; }
/* the four bins */
.bins { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.bin { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: 10px; border: 1.5px solid var(--line); background: #170d2b; color: var(--dim); cursor: pointer; text-align: center; min-height: 52px; justify-content: center; }

.bin.b-keep.on { color: var(--ice); border-color: var(--ice); background: #14233a; }
.bin.b-scry.on { color: var(--gold); border-color: var(--gold); background: #2a2214; }
.bin.b-letgo.on { color: var(--ember); border-color: var(--ember); background: #2a160e; }
.bin.on span { color: currentColor; }
.rune .dest { font-size: 12.5px; color: var(--dim); margin-top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.rune .dest b { color: var(--ink); font-weight: 600; }
.linkbtn { background: none; border: none; padding: 0 2px; color: var(--lilac); font-size: 12.5px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
@media (max-width: 420px) { .bins { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* the brain badge: which brain is answering */
.brain { display: inline-flex; align-items: center; gap: 4px; font: 12px/1 system-ui, sans-serif; padding: 3px 8px; border-radius: 999px; border: 1px solid; white-space: nowrap; vertical-align: middle; cursor: help; }
.brain img.pi { width: 12px; height: 12px; }

.brain.claude { color: var(--gold); border-color: #8a6a20; background: rgba(255,208,112,.06); }
.brain.code { color: var(--dim); border-color: var(--line); }
.brainrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--dim); }
.a > .brain { display: flex; width: max-content; margin-bottom: 6px; }
.flyer { position: fixed; z-index: 40; width: 48px; height: 36px; pointer-events: none; }
/* the four doors */
.doors { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 15; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; width: min(460px, calc(100% - 24px)); padding: 6px; background: rgba(21,12,39,.96); border: 2px solid #4a2a6a; border-radius: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.5); backdrop-filter: blur(6px); }

.doors button canvas, .doors .dimg img { width: 28px; height: 28px; image-rendering: pixelated; display: block; }
.doors .dimg { width: 28px; height: 28px; display: grid; place-items: center; }
.doors .dimg img { width: 22px; height: 22px; }
.doors .dglyph { font-size: 24px; line-height: 28px; height: 28px; color: var(--mint); }
.doors button:hover { color: var(--text); background: #24163c; }
.doors button.on { color: var(--text); background: #2a1a4a; border-color: #6a3aa0; }
.doors button[data-door="write"] .dimg { background: var(--lilac); border-radius: 50%; width: 30px; height: 28px; }
/* sheets */
.veil { position: fixed; inset: 0; background: rgba(5,0,12,0.7); z-index: 20; display: none; }
.veil.open { display: block; }
.sheet { position: fixed; z-index: 21; background: var(--panel); border: 2px solid var(--lilac); display: none; flex-direction: column; gap: 10px; padding: 16px; overflow: auto;
  right: 16px; top: calc(16px + env(safe-area-inset-top)); bottom: 16px; width: min(480px, calc(100% - 32px)); border-radius: 14px; }
.sheet.wide { width: min(820px, calc(100% - 32px)); }
.sheet.open { display: flex; }
.sheet h3 { margin: 0; font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-weight: normal; font-size: 34px; display: flex; align-items: center; gap: 10px; line-height: 1; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 14px/1 system-ui, sans-serif; color: var(--dim); background: var(--panel2); border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 12px; cursor: pointer; }
.chip.on { color: var(--bg); background: var(--lilac); border-color: var(--lilac); }
.checks { display: flex; gap: 16px; flex-wrap: wrap; }

.btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

mark { background: color-mix(in srgb, var(--gold) 35%, transparent); color: inherit; border-radius: 3px; }
.mhead { display: flex; gap: 14px; align-items: center; }

.mgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.mgrid button { text-align: left; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.mgrid button.hl { border-color: #8a6a20; background: #241a14; }

.mgrid button span { font-size: 12.5px; color: var(--dim); }
#askLog { display: flex; flex-direction: column; gap: 10px; flex: 1; }
.q { align-self: flex-end; background: var(--panel2); border-radius: 12px 12px 2px 12px; padding: 8px 12px; max-width: 88%; white-space: pre-wrap; font-size: 15px; }
.a { background: #1a1030; border: 1.5px solid var(--line); border-radius: 12px 12px 12px 2px; padding: 10px 14px; font-size: 15px; line-height: 1.5; }
.a p { margin: 0 0 8px; } .a p:last-child { margin: 0; } .a ul, .a ol { margin: 4px 0; padding-left: 20px; }
.ref { display: inline-block; color: var(--gold); border: 1px solid #8a6a20; border-radius: 999px; padding: 0 7px; font-size: 13px; cursor: pointer; margin: 0 1px; }
.ref:hover { background: #2a1e10; }
.plan .grp { margin-top: 8px; }
.plan .grp .gh { font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-size: 20px; color: var(--pink); margin: 6px 0 2px; }
.plan .pr { display: flex; gap: 8px; align-items: center; padding: 5px 4px; border-radius: 6px; font-size: 14px; }
.plan .pr:hover { background: #1b1030; }

.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
.seg button { border: none; border-radius: 0; padding: 4px 9px; font-size: 12.5px; background: transparent; color: var(--dim); }
.seg button + button { border-left: 1.5px solid var(--line); }
.seg button.on.td { background: var(--gold); color: var(--bg); }
.seg button.on.wk { background: var(--ice); color: var(--bg); }
.stonerow { display: flex; gap: 8px; align-items: center; padding: 5px 0; font-size: 14px; }
.stonerow input[type=text] { flex: 1; font-size: 14px; padding: 5px 8px; }
.stonerow button { padding: 4px 8px; font-size: 13px; }
/* threads: objects you pick up, the held card, drawers */
.satchel { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 10px; border-radius: 999px; background: #1a0f2e; }
.pill img { width: 12px; height: 12px; image-rendering: pixelated; }
.pill.rune { border-color: #3a7a6a; color: var(--mint); } .pill.new { border-color: #8a6a20; color: var(--gold); } .pill.q { border-color: #8a3a6a; color: var(--pink); }
.weekline { width: 100%; display: flex; align-items: center; gap: 8px; background: none; border: none; border-top: 1px solid #241838; border-radius: 0; margin-top: 8px; padding: 9px 6px 3px; text-align: left; }
.weekline span:first-child { font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-size: 20px; color: var(--ice); }
.weekline .chev, .tstep .chev, .drawer .chev { margin-left: auto; color: var(--dim); }
.trow { padding: 8px 0; } .trow + .trow { border-top: 1px solid #241838; }
.trow .th { display: flex; align-items: center; gap: 8px; }

.pips { display: inline-flex; gap: 3px; } .pips i { width: 9px; height: 9px; border-radius: 2px; background: #2e1e48; display: inline-block; } .pips i.nx { outline: 1.5px solid var(--dim); outline-offset: -1.5px; background: transparent; }
.trow .tw { font-size: 14px; margin: 3px 0 0 66px; }
.tstep { display: flex; align-items: center; gap: 10px; width: calc(100% - 66px); margin: 6px 0 0 66px; text-align: left; background: #1a0f2e; padding: 7px 10px; }
.tstep img { width: 24px; height: 24px; image-rendering: pixelated; flex: none; }
.tstep span { display: flex; flex-direction: column; min-width: 0; font-size: 14px; } .tstep b { font-weight: 500; }
.shelfh { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; } .shelfh h3 { margin-bottom: 4px; }
.objs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 6px; }
.obj { background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 10px 10px; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; cursor: pointer; transition: transform .12s, border-color .12s; min-width: 0; color: var(--text); font: inherit; }
.obj:hover { transform: translateY(-3px); border-color: var(--lilac); }

@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.obj .n { font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-size: 24px; line-height: .95; }
.obj .nx { font-size: 12.5px; color: var(--dim); line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.obj.add { border-style: dashed; justify-content: center; color: var(--dim); background: transparent; }
.obj.add .plus { font-size: 34px; line-height: 1; }
.sprite { width: 48px; height: 48px; image-rendering: pixelated; flex: none; }
.sprite.big { width: 72px; height: 72px; }
.held { background: var(--panel); border: 1.5px solid #4a3270; border-radius: 16px; padding: 16px clamp(12px, 3vw, 22px); display: flex; flex-direction: column; gap: 16px; max-width: 900px; margin: 0 auto; }
.hhead { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }

.hhead .ht { flex: 1 1 260px; min-width: 0; }
.hhead .hb { display: flex; gap: 8px; align-items: center; }
.nextbox { display: flex; gap: 12px; align-items: center; border: 2px solid #6a3aa0; background: #1d1036; border-radius: 12px; padding: 12px 14px; font-size: 16px; }
.nextbox .chk { width: 24px; height: 24px; }
.nextbox .nt { cursor: pointer; overflow-wrap: anywhere; }
.nextbox.empty { border-style: dashed; border-color: var(--line); background: transparent; color: var(--dim); }
.nextbox.stone { border-color: #3a5a5a; }
.pickbtn { flex: none; font-size: 13px; } .pickbtn.on { color: var(--gold); border-color: #8a6a20; }
.hsec .hl { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.hsec .hl > span:first-child { font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-size: 24px; color: var(--pink); line-height: 1; }
.thread { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.step { font-size: 13px; padding: 5px 10px; border-radius: 8px; background: #1a0f2e; display: inline-flex; align-items: center; gap: 6px; max-width: 100%; text-align: left; }

.step.next { border: 2px solid var(--lilac); color: var(--text); }

.flag { width: 8px; height: 10px; display: inline-block; clip-path: polygon(0 0, 100% 25%, 0 50%); flex: none; }
.ties { display: flex; flex-wrap: wrap; gap: 6px; }
.tiechip { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; max-width: 100%; }
.tiechip button { border: none; border-radius: 0; background: #1a0f2e; font-size: 13px; padding: 4px 10px; display: inline-flex; align-items: center; gap: 6px; min-width: 0; }

.drawer img { width: 14px; height: 14px; image-rendering: pixelated; }
.drawer .c { color: var(--dim); font-size: 13px; }
.drawer.on { border-color: var(--lilac); background: #241540; }
.drawerbody { margin-top: 8px; }
.about summary { cursor: pointer; color: var(--dim); font-size: 14px; } .about .body { margin-top: 6px; }
.tossh { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 45; border-radius: 12px; border: 2px solid #5a3a2a; box-shadow: 0 8px 24px rgba(0,0,0,.5); transform: translateY(160%); transition: transform .35s ease; pointer-events: none; width: 142px; height: 84px; }
.tossh.show { transform: none; }
.paperball { position: fixed; z-index: 46; width: 18px; height: 18px; pointer-events: none; image-rendering: pixelated; }
.signin { max-width: 380px; margin: 60px auto; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.signin canvas { width: 96px; height: 96px; }

.signin input { width: 100%; text-align: center; padding: 11px; font-size: 16px; }
body.signedout .doors { display: none; }
/* the rune table */
.tablecard { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 14px; border-radius: 12px; background: linear-gradient(135deg, #2a1648, #170d2b); border: 1.5px solid #6a3aa0; }
.tablecard:hover { border-color: var(--lilac); }
.tablecard .sprite { width: 40px; height: 40px; }
.tablecard > span:nth-child(2) { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.tablecard b { font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-weight: normal; font-size: 24px; line-height: 1; }
.tablecard .chev { color: var(--lilac); font-size: 13px; white-space: nowrap; }
.tablecard .rt { font-size: 30px; color: var(--gold); width: 40px; text-align: center; }
.tablewrap { display: flex; justify-content: center; }
.tablecv { border-radius: 14px; border: 2px solid #3e2a5e; max-width: 100%; height: auto; }
.candlebar { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; margin: 10px 0 14px; }
.candlebar .ctime { font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-size: 28px; color: var(--gold); min-width: 70px; text-align: center; }
.tgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.tp { min-width: 0; }
.tobj { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.tobj .tname { font-size: 28px; }
.goal { display: flex; gap: 10px; align-items: center; background: #1d1036; border: 1.5px solid #3a2a58; border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; }
.runes { display: flex; flex-direction: column; gap: 4px; }
.litrune { display: flex; gap: 10px; align-items: baseline; font-size: 14px; }
.litrune .glyph { color: var(--gold); text-shadow: 0 0 6px rgba(255, 208, 112, .6); width: 14px; }
.litrune .sub { margin-left: auto; font-size: 12px; white-space: nowrap; }
.tp textarea { min-height: 70px; }
/* the fireplace: drag logs into the fire */
.fireplace { position: relative; margin: 0 auto; max-width: 100%; touch-action: none; }
.fireplace canvas { display: block; width: 100%; height: 100%; border-radius: 10px; border: 2px solid #3a2058; cursor: pointer; }
.fireplace .logs { position: absolute; inset: 0; pointer-events: none; }
.fireplace.big { margin: 0 auto 10px; }
.fireplace .scene { margin: 0; }
.log { pointer-events: auto; position: absolute; width: calc(100% * 10 / 71); height: calc(100% * 5 / 42); min-width: 30px; min-height: 15px; padding: 0; border: none; background: none; cursor: grab; touch-action: none; z-index: 2; }
.log img { width: 100%; height: 100%; image-rendering: pixelated; display: block; filter: drop-shadow(0 2px 0 rgba(0,0,0,.4)); }
.log:hover img { filter: drop-shadow(0 0 4px #ffd070); }
.log.dragging { cursor: grabbing; z-index: 5; }
.log.burning { transition: transform .38s ease-in, opacity .38s ease-in; opacity: 0; transform: scale(.2) !important; }
/* a log's name tag: tap to read it; it follows the log while you drag */
.logtag { display: none; position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); pointer-events: none; background: rgba(12,6,24,.94); border: 1.5px solid #7a4a28; border-radius: 8px; padding: 5px 9px; text-align: center; white-space: nowrap; max-width: 220px; z-index: 6; box-shadow: 0 3px 0 rgba(0,0,0,.4); }
.logtag b { display: block; font-weight: 600; font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; }
.logtag small { display: block; font-size: 11px; color: var(--ember); margin-top: 2px; }
.logtag::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -5px; border: 5px solid transparent; border-top-color: #7a4a28; }
.log.show .logtag, .log.dragging .logtag, .log:focus-visible .logtag { display: block; }
@media (hover: hover) { .log:hover .logtag { display: block; } }
.log.show, .log:hover { z-index: 4; }
.morelogs { position: absolute; right: 6px; bottom: 6px; font-size: 12px; color: var(--gold); background: rgba(12,6,24,.8); padding: 1px 6px; border-radius: 999px; }
.obj.basket { border-style: dashed; }
/* the closing ritual */
.ritual { position: fixed; inset: 0; z-index: 50; background: rgba(4,1,10,.92); display: none; align-items: center; justify-content: center; padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); }
.ritual.open { display: flex; }
.rbox { width: min(600px, 100%); max-height: 100%; overflow: auto; background: var(--page); border: 2px solid #5a3a8a; border-radius: 16px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
.rbox h3 { margin: 0; font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-weight: normal; font-size: 38px; line-height: 1; color: var(--ink); }
.rsteps { display: flex; gap: 6px; }
.rsteps i { flex: 1; height: 4px; border-radius: 4px; background: #2e1e48; }
.rsteps i.on { background: var(--gold); }
.rlist { max-height: 38vh; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
.rlist .pr { display: flex; gap: 8px; align-items: flex-start; padding: 6px 6px; border-radius: 8px; font-size: 14.5px; cursor: pointer; }
.rlist .pr:hover { background: #22143a; }
.rlist .pr.sel { background: #3a2a10; outline: 1.5px solid var(--gold); }
.rlist .pr .w { color: var(--dim); font-size: 12px; display: block; }
.lightsout { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.lightsout canvas { max-width: 100%; border-radius: 12px; border: 2px solid #2a1a44; }
.lightsout .gn { font-family: "m5x7", monospace; -webkit-font-smoothing: none; font-size: 40px; line-height: 1; color: var(--ink); }
#toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--lilac); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 60; max-width: 90%; }
#toast.show { opacity: 1; pointer-events: auto; }
#toast a { color: var(--bg); text-decoration: underline; margin-left: 8px; cursor: pointer; }
footer { color: #5a4a78; font-size: 12px; text-align: center; margin-top: 34px; }
.fade { animation: fade .22s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (max-width: 900px) {
  .home { grid-template-columns: 1fr; }
  .home > .left, .homecol { grid-column: 1; grid-row: auto; }
  .cols { grid-template-columns: 1fr; }
}
@media (max-width: 700px) {
  .bos { grid-template-columns: 1fr; padding: 8px; }
  .bos::before { display: none; }
  .leaf { min-height: 0; }
  .leaf.l { border-radius: 12px 12px 2px 2px; }
  .leaf.r { border-radius: 2px 2px 12px 12px; border-top: 2px solid #3a2058; }
}
@media (max-width: 720px) { .tgrid { grid-template-columns: 1fr; } }
@media (max-width: 600px) {
  h1 { font-size: 28px; }
  #logo { width: 32px; height: 32px; }
  .iconbtn { width: 38px; height: 38px; }
  .iconbtn img { width: 20px; height: 20px; }
  header { gap: 8px; }
  #hdrSub { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #app { padding-bottom: 160px; }
  .sheet, .sheet.wide { left: 0; right: 0; bottom: 0; top: auto; width: 100%; max-height: 90vh; border-radius: 16px 16px 0 0; border-bottom: none; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  .ptitle h2 { font-size: 38px; }
  .grim .gh h2 { font-size: 38px; }
  .mgrid { grid-template-columns: 1fr 1fr; }
  .munin canvas { width: 56px; height: 56px; }
  .trow .tw { margin-left: 0; } .tstep { width: 100%; margin-left: 0; }
  .thread { flex-direction: column; align-items: stretch; gap: 0; border-left: 2px solid #3a2a58; margin-left: 8px; padding-left: 12px; }
  .thread .arrow { display: none; }
  .thread .step { margin: 3px 0; position: relative; justify-content: flex-start; }
  .thread .step::before { content: ""; position: absolute; left: -18px; top: 50%; width: 9px; height: 9px; margin-top: -5px; border-radius: 50%; background: #3a2a58; }
  .thread .step.done::before { background: var(--mint); } .thread .step.next::before { background: var(--lilac); }
  .objs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .drawers { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .sprite.big { width: 60px; height: 60px; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <canvas id="logo" width="16" height="16" aria-hidden="true" data-go=""></canvas>
    <div class="brand" data-go=""><h1 class="px">THE COTTAGE</h1><div class="sub" id="hdrSub"></div></div>
    <span class="spacer"></span>
    <button class="iconbtn" id="searchBtn" aria-label="Find anything" title="Find (/)"></button>
    <button class="iconbtn" id="menuBtn" aria-label="Cottage keeping" title="Backups and settings"></button>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
  <footer>The Cottage: a little Hedgewitch home for everything you know and plan.</footer>
</div>
<!-- the four doors: the only navigation you ever need -->
<nav class="doors" aria-label="The four doors">
  <button data-door="home" aria-label="Home: the cottage and today"><canvas id="doorHomeCv" width="16" height="16"></canvas><span>Home</span></button>
  <button data-door="write" aria-label="Write: the Book of Shadows" title="Write (N)"><span class="dimg" id="doorWriteImg"></span><span>Write</span></button>
  <button data-door="focus" aria-label="Focus: the rune table"><span class="dglyph">ᚱ</span><span>Focus</span></button>
  <button data-door="munin" aria-label="Munin" title="Munin (M)"><canvas id="muninFabCv" width="16" height="16"></canvas><span>Munin</span></button>
</nav>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="ritual" id="ritual" role="dialog" aria-modal="true"></div>
<div id="toast"></div>
<script>
"use strict";
// ============================================================ 01 · data: the rooms, what's saved, and how it syncs
// Everything lives in two collections, "items" and "projects", plus a few "meta" documents.
// Two ways to run:
//   server mode  opened from Sophia's own Cottage server: synced through its API, the same on every device,
//                and readable by Claude in any chat through the Cottage connector. This is the real Cottage.
//   local mode   opened as a file (for testing): kept in this browser only (localStorage).
// (The old claude.ai artifact mode was retired in phase 1 of the blueprint, 21 Nov 2026.)

const ROOMS = {
  stargazer: { name: "Observatory", what: "Stargazer", r: [8, 38, 71, 38] },
  coven:     { name: "Coven Chamber", what: "Coven", r: [81, 38, 71, 38] },
  games:     { name: "Workshop", what: "Hedgewitch Games", r: [8, 78, 144, 42] },
  school:    { name: "Study", what: "School", r: [8, 122, 71, 40] },
  jobs:      { name: "Writing Desk", what: "Jobs and money", r: [81, 122, 71, 40] },
  life:      { name: "Hearth", what: "Life, the big picture, and the woodpile", r: [8, 164, 71, 42] },
  book:      { name: "Book of Shadows", what: "Runes waiting for Munin to sort", r: [81, 164, 71, 42] },
};
const AREA_ORDER = ["games", "coven", "stargazer", "school", "jobs", "life"];
const KINDS = { todo: "To-do", question: "Question", note: "Note", idea: "Idea", decision: "Decision", link: "Link", doc: "Page", log: "Done" };
// The three trails of The Sending, and which rooms walk them.
const TRAILS = {
  job:    { name: "Job", what: "A paycheck, never retail again", col: "#9fe6d0" },
  games:  { name: "Games", what: "Shipped games and income from them", col: "#ff7ad9" },
  school: { name: "School", what: "Back in school, on the right degree", col: "#8ac0e8" },
};
const AREA_TRAIL = { games: "games", coven: "games", stargazer: "games", jobs: "job", school: "school" };
const DEFAULT_ROAD = {
  job: [
    { id: "w-job-ready", title: "Resume, cover letter and GitHub ready", done: true },
    { id: "w-job-interview", title: "First interview", done: false },
    { id: "w-job-paycheck", title: "First paycheck that isn't retail", done: false },
    { id: "w-job-field", title: "A job in data, QA or game dev (work from home if possible)", done: false },
  ],
  games: [
    { id: "w-g-studio", title: "Studio named: Hedgewitch Games", done: true },
    { id: "w-g-itch", title: "A game on itch.io (Witchbottle)", done: true },
    { id: "w-g-site", title: "Website live", done: true },
    { id: "w-g-ads", title: "Ads on the website", done: true },
    { id: "w-g-dollar", title: "First dollar from games", done: false },
    { id: "w-g-paid", title: "First paid game", done: false },
    { id: "w-g-steam", title: "A game on Steam", done: false },
  ],
  school: [
    { id: "w-s-path", title: "Choose the path: CS or computer engineering", done: true },
    { id: "w-s-papers", title: "Reapplication paperwork done", done: false },
    { id: "w-s-enrolled", title: "Enrolled again", done: false },
    { id: "w-s-intern", title: "An internship", done: false },
  ],
};
const HW = 160, HH = 224;                                    // the house picture, in pixels before scaling
const RW = 160, RH = 84;                                     // the road picture

const S = { items: {}, projects: {}, meta: {}, ready: false, mode: "loading", note: "", open: new Set(), chat: [], hover: null, pending: false, flash: {}, drawer: {}, table: { running: false, start: 0, mins: 25, left: 0 } };
let MUNIN_AI = null, SERVER = false;   // MUNIN_AI: Munin's Hearth brain (null when there isn't one); SERVER: running on Sophia's own Cottage server
// Which brain is answering, for the badge: the Hearth brain's model name (from the server), or "" when Munin only has plain code.
const BRAIN = { model: "" };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const newId = p => p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const snip = (s, n = 120) => { s = String(s || "").replace(/[#*`>|]/g, "").replace(/\s+/g, " ").trim(); return s.length > n ? s.slice(0, n - 1) + "..." : s; };
const fmtDate = ms => ms ? new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "";
const safeUrl = u => /^https?:\/\//i.test(String(u || "")) ? u : "#";
const pad2 = n => String(n).padStart(2, "0");
const dayKey = (d = new Date()) => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
// A "night" runs from 5 in the morning to 5 the next morning, so closing up at 1am still counts as last night.
const nightKey = (ms = Date.now()) => dayKey(new Date(ms - 5 * 3600e3));
const startOfDay = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
const startOfWeek = () => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); };

// ---- what counts as what
const live = o => o && !o.wood;                                             // not hexed into firewood
const items = () => Object.values(S.items).filter(live);
const projects = () => Object.values(S.projects).filter(live).sort((a, b) => (a.order ?? 99) - (b.order ?? 99) || String(a.name).localeCompare(b.name));
const projOf = it => { const p = it && it.project && S.projects[it.project]; return live(p) ? p : null; };
const roomOf = it => it.area === "inbox" || it.area === "book" || !ROOMS[it.area] ? "book" : it.area;   // old "Mailbox" notes now sit in the book
const isRune = it => roomOf(it) === "book";
const openTodo = i => i.kind === "todo" && !i.done && !isRune(i), openQ = i => i.kind === "question" && !i.done && !isRune(i);
const isNew = i => i.seen === false;
const doneAt = i => i.doneAt || (i.done ? i.updated : 0) || 0;
const doneToday = () => items().filter(i => i.kind === "todo" && i.done && doneAt(i) >= startOfDay());
const loggedToday = () => items().filter(i => i.kind === "log" && (i.date === dayKey() || (!i.date && (i.created || 0) >= startOfDay())));
const sentToday = () => [...doneToday(), ...loggedToday()];
const pickOf = i => (i.kind === "todo" && (!i.done || doneAt(i) >= startOfDay())) ? (i.pick || "") : "";
const road = () => { const r = S.meta.road; return r && r.job ? r : DEFAULT_ROAD; };
const night = () => S.meta.night || {};
const isNight = () => night().closed === nightKey();
function counts(area) {
  const its = items().filter(i => roomOf(i) === area);
  const wk = startOfWeek();
  return { todo: its.filter(openTodo).length, q: its.filter(openQ).length, all: its.length, fresh: its.filter(isNew).length,
    projects: projects().filter(p => (p.area || "games") === area).length, week: its.filter(i => i.kind === "todo" && i.done && doneAt(i) >= wk).length };
}
function trailOf(p) { return p.trail || AREA_TRAIL[p.area] || ""; }
function whereText(it) { const p = projOf(it); const R = ROOMS[roomOf(it)]; return p ? R.name + " › " + p.name : R.name; }

// ---- the library of layers: a page can sit inside another page (a chapter), as deep as needed
const pageOf = id => { const d = id && S.items[id]; return live(d) && d.kind === "doc" ? d : null; };
const topPage = d => !pageOf(d.parent) || d.parent === d.id;                 // a page with no (living) page above it
function parentsOf(d) { const out = [], seen = new Set([d.id]); let cur = d; while (cur.parent && !seen.has(cur.parent) && pageOf(cur.parent)) { cur = S.items[cur.parent]; seen.add(cur.id); out.unshift(cur); } return out; }
const childPages = d => items().filter(i => i.kind === "doc" && i.parent === d.id && i.id !== d.id);

// ---- sorting
const byOld = (a, b) => (a.created || 0) - (b.created || 0);
const byNew = (a, b) => (b.updated || b.created || 0) - (a.updated || a.created || 0);
const byPinOld = (a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || byOld(a, b);
const byLogDate = (a, b) => String(b.date || "").localeCompare(String(a.date || "")) || (b.created || 0) - (a.created || 0);

// ============================================================ storage
const LS = {
  get(k) { try { return JSON.parse(localStorage.getItem("brain_" + k)) || {}; } catch (e) { return {}; } },
  set(k, v) { try { localStorage.setItem("brain_" + k, JSON.stringify(v)); } catch (e) {} },
};
const PREF = {   // per-device settings (sound), never synced
  get(k, d) { try { const v = localStorage.getItem("cottage_pref_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("cottage_pref_" + k, JSON.stringify(v)); } catch (e) {} },
};
function put(col, id, data) {
  const prev = S[col][id], body = { ...data, updated: Date.now() }; delete body.id;
  for (const k of Object.keys(body)) if (body[k] === undefined) delete body[k];
  S[col][id] = { ...body, id }; render();
  if (col !== "meta" && !EV.quiet) changeEvents(col, prev, S[col][id]);
  if (SERVER) return serverWrite(col, id, body);
  const all = LS.get(col); all[id] = body; LS.set(col, all); return Promise.resolve();
}
function del(col, id) {
  delete S[col][id]; render();
  if (SERVER) return serverWrite(col, id, null);
  const all = LS.get(col); delete all[id]; LS.set(col, all); return Promise.resolve();
}
function putMeta(key, data) {
  S.meta[key] = data; render();
  if (SERVER) return serverWrite("meta", key, data);
  const m = LS.get("meta"); m[key] = data; LS.set("meta", m); return Promise.resolve();
}
// Small helpers so the rest of the code reads like what it does.
const saveItem = (it, changes) => put("items", it.id, { ...it, ...changes });
function setDone(it, done) {
  const ch = { done, doneAt: done ? Date.now() : 0 };
  if (it.kind === "question" && done && !it.answer) ch.answer = it.answer || "";
  saveItem(it, ch);
  if (done) { cheer(it); }
}
// Hexing something turns it into a log for the woodpile by the Hearth: hidden everywhere else.
// Sophia burns logs by dragging them into the fire herself, or pulls one back off the pile if she changes her mind.
function hex(col, id, fromEl) { const o = S[col][id]; if (!o) return; toss(fromEl ? fromEl.getBoundingClientRect() : null); put(col, id, { ...o, wood: Date.now() }); toast("Hexed into firewood. It's on the woodpile", "Undo", () => unhex(col, id)); }
function unhex(col, id) { const o = S[col][id]; if (!o) return; const d = { ...o }; delete d.wood; put(col, id, d); }
const woodpile = () => [...Object.values(S.items).filter(i => i.wood).map(i => ({ col: "items", o: i })), ...Object.values(S.projects).filter(p => p.wood).map(p => ({ col: "projects", o: p }))].sort((a, b) => b.o.wood - a.o.wood);
async function burnOne(col, id) { logEvent("burn", S[col][id], null, col); await del(col, id); S.flash.fire = Date.now(); sfx("burn"); }
async function burnAll() { const w = woodpile(); for (const { col, o } of w) { logEvent("burn", o, null, col); await del(col, o.id); } S.flash.fire = Date.now(); sfx("burn"); return w.length; }
// Pages keep their old versions, so a changed plan never loses how we got here.
function savePage(it, title, body) {
  const hist = Array.isArray(it.history) ? it.history.slice() : [];
  if (it.body !== undefined && (it.body !== body || it.title !== title) && (it.body || it.title)) hist.unshift({ title: it.title || "", body: it.body || "", at: it.updated || it.created || Date.now(), by: it.by || "" });
  saveItem(it, { title, body, history: hist.slice(0, 15), by: "Sophia" });
}

// ============================================================ the event log: what happened, never what it said
// Every capture, sort, pick, finish, hex, burn, focus session and night closed becomes one small event: its type, when,
// and which room, project and kind it touched, but never a note's text. Events wait in an outbox on this device and go to
// the server's event log in batches (the dataset behind the Ledger, the spreadsheets and the Tableau dashboard).
// In a local copy they stay on this device.
const EV = { outbox: [], flushing: null, quiet: false, src: "" };
function logEvent(type, o, extra, col) {
  const ev = { cid: newId("e"), at: Date.now(), type, who: "Sophia" };
  if (o && o.id) {
    const isP = col === "projects" || (!col && S.projects[o.id] === o);
    ev.ref = (isP ? "p:" : "i:") + o.id;
    if (isP) { ev.area = o.area || ""; ev.project = o.id; } else { ev.kind = o.kind || ""; ev.area = roomOf(o); ev.project = o.project || ""; }
  }

// ============================================================ threads and ties
// A reference points at something in the cottage: "i:<item id>", "p:<project id>" or "w:<trail>:<waystone id>".
// A thread step is a reference, or {t: "text", d: false} for a step that isn't a to-do yet.
function resolve(ref) {
  if (ref && typeof ref === "object") return { kind: "text", ref, label: ref.t || "", done: !!ref.d };
  const s = String(ref || "");
  if (s.startsWith("i:")) { const it = S.items[s.slice(2)]; return live(it) ? { kind: "item", ref: s, it, label: it.title, done: it.kind === "log" || it.kind === "decision" || !!it.done, proj: projOf(it) } : null; }
  if (s.startsWith("p:")) { const p = S.projects[s.slice(2)]; return live(p) ? { kind: "project", ref: s, p, label: p.name, done: false } : null; }
  if (s.startsWith("w:")) { const [, k, id] = s.split(":"); const w = (road()[k] || []).find(x => x.id === id); return w ? { kind: "stone", ref: s, trail: k, w, label: w.title, done: !!w.done } : null; }
  return null;
}
const refKey = r => typeof r.ref === "string" ? r.ref : "t:" + (r.ref.t || "");
// A project's thread: the steps it walks toward a waystone. Written by hand (or by Munin), or worked out from its to-dos.
function threadOf(p) {
  if (Array.isArray(p.thread) && p.thread.length) return { steps: p.thread.map(resolve).filter(Boolean), custom: true };
  const its = itemsOf(p).filter(i => i.kind === "todo");
  const done = its.filter(i => i.done).sort((a, b) => doneAt(b) - doneAt(a)).slice(0, 1);
  const rank = i => ({ today: 0, week: 1 }[i.pick] ?? 2);
  const open = its.filter(i => !i.done).sort((a, b) => rank(a) - rank(b) || byPinOld(a, b));
  const steps = [...done, ...open].map(i => resolve("i:" + i.id));
  const tr = trailOf(p), st = (road()[tr] || []).find(w => !w.done);
  if (st) steps.push(resolve("w:" + tr + ":" + st.id));
  return { steps: steps.filter(Boolean), custom: false };
}
// The one next thing to do: the first unfinished step that isn't just a milestone.
function nextStep(p) { const st = threadOf(p).steps; return st.find(s => !s.done && s.kind !== "stone") || st.find(s => !s.done) || null; }
function tiesOf(p) {
  if (p.virtual) return [];
  const mine = new Set(itemsOf(p).map(i => "i:" + i.id)), out = new Map();
  const add = ref => { if (!ref || ref === "p:" + p.id || mine.has(ref) || out.has(ref)) return; const r = resolve(ref); if (r) out.set(ref, r); };
  (p.links || []).forEach(add);
  for (const i of items()) { const ls = i.links || []; if (i.project === p.id) ls.forEach(add); else if (ls.includes("p:" + p.id) || ls.some(l => mine.has(l))) add("i:" + i.id); }
  for (const q of projects()) if ((q.links || []).includes("p:" + p.id)) add("p:" + q.id);
  const inThread = new Set(threadOf(p).steps.map(refKey));
  return [...out.values()].filter(r => !inThread.has(r.ref));
}
function tie(fromRef, toRef) {
  if (!fromRef || !toRef || fromRef === toRef) return;
  const [k, id] = fromRef.split(/:(.+)/), col = k === "p" ? "projects" : "items", o = S[col][id]; if (!o) return;
  const links = Array.isArray(o.links) ? o.links.slice() : []; if (!links.includes(toRef)) links.push(toRef);
  put(col, id, { ...o, links });
}
function untie(fromRef, toRef) {
  const [k, id] = fromRef.split(/:(.+)/), col = k === "p" ? "projects" : "items", o = S[col][id];
  if (o && Array.isArray(o.links) && o.links.includes(toRef)) { put(col, id, { ...o, links: o.links.filter(l => l !== toRef) }); return; }
  // the tie may have been made from the other side
  const [k2, id2] = toRef.split(/:(.+)/), col2 = k2 === "p" ? "projects" : "items", o2 = S[col2][id2];
  if (o2 && Array.isArray(o2.links)) put(col2, id2, { ...o2, links: o2.links.filter(l => l !== fromRef) });
}


// ============================================================ the Cottage server: Sophia's own home for the data
// When the app is opened from its own server, it talks to the server's API:
// changes are sent right away (and queued if the connection drops), and it checks for changes from other devices every few seconds.
const SV = { rev: 0, outbox: [], timer: 0, syncing: false };
async function apiCall(method, path, body) {

  if (r.status === 401) { showSignIn(); throw Object.assign(new Error("signed out"), { code: "signed_out" }); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(data.message || data.error || "request failed"), { code: data.error || "http_" + r.status, text: data.message });

}
async function serverStart() {
  if (!/^https?:$/.test(location.protocol)) return false;
  let r; try { r = await fetch("/api/me", { credentials: "same-origin" }); } catch (e) { r = null; }
  if (!r) { const c = LS.get("cottage_cache"); if (c && c.rev) { SERVER = true; S.mode = "server"; loadCache(c); S.note = "You're offline. Showing what was here last time; changes will sync when you're back."; S.ready = true; render(); return true; } return false; }
  const kind = r.headers.get("Content-Type") || "";
  if (r.status === 401 && kind.includes("json")) { SERVER = true; S.mode = "server"; showSignIn(); return true; }
  if (!r.ok || !kind.includes("json")) return false;
  SERVER = true; S.mode = "server";
  try { BRAIN.model = (await r.json()).model || ""; } catch (e) { }
  SV.outbox = (LS.get("cottage_outbox") || {}).ops || [];
  const c = LS.get("cottage_cache"); if (c && c.rev) { loadCache(c); S.ready = true; render(); }
  setupServerMunin();
  await serverSync(); flushOutbox();
  flushEvents();
  clearInterval(SV.timer); SV.timer = setInterval(() => { if (!document.hidden) { serverSync(); flushOutbox(); flushEvents(); } }, 12000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { serverSync(); flushOutbox(); flushEvents(); } });
  addEventListener("online", () => { S.note = ""; serverSync(); flushOutbox(); flushEvents(); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  return true;
}
function loadCache(c) { for (const col of ["items", "projects", "meta"]) { S[col] = {}; for (const [id, v] of Object.entries(c[col] || {})) S[col][id] = col === "meta" ? v : { ...v, id }; } SV.rev = c.rev || 0; }
function saveCache() { const strip = o => Object.fromEntries(Object.entries(o).map(([k, v]) => { const d = { ...v }; delete d.id; return [k, d]; })); LS.set("cottage_cache", { rev: SV.rev, items: strip(S.items), projects: strip(S.projects), meta: S.meta }); }
async function serverSync() {
  if (SV.syncing) return; SV.syncing = true;
  try {
    const { rev, docs } = await apiCall("GET", "/api/sync?since=" + (SV.rev || 0));
    if (!SV.rev) { S.items = {}; S.projects = {}; S.meta = {}; }
    const pending = new Set(SV.outbox.map(o => o.col + "/" + o.id));
    for (const d of docs) { if (pending.has(d.col + "/" + d.id)) continue;   // our own unsent change wins until it's sent
      if (d.deleted) delete S[d.col][d.id]; else S[d.col][d.id] = d.col === "meta" ? d.data : { ...d.data, id: d.id }; }
    SV.rev = rev; S.ready = true; if (S.note.startsWith("You're offline")) S.note = "";
    if (docs.length || !LS.get("cottage_cache").rev) saveCache();
    if (docs.length) render(); else if (!S.built) render();
  } catch (e) { if (e.code !== "signed_out" && !S.note) { S.note = "You're offline. Changes are kept on this device and will sync when you're back."; render(); } }
  SV.syncing = false;
}
function serverWrite(col, id, data) {
  SV.outbox = SV.outbox.filter(o => !(o.col === col && o.id === id)); SV.outbox.push({ col, id, data });
  LS.set("cottage_outbox", { ops: SV.outbox }); saveCache();
  return flushOutbox();
}
let flushing = null;
function flushOutbox() {
  if (flushing) return flushing;
  if (!SV.outbox.length) return Promise.resolve();
  flushing = (async () => {
    while (SV.outbox.length) {
      const batch = SV.outbox.slice(0, 100);
      try { const r = await apiCall("POST", "/api/batch", { ops: batch }); SV.outbox = SV.outbox.filter(o => !batch.includes(o)); LS.set("cottage_outbox", { ops: SV.outbox }); if (r.rev && r.rev === SV.rev + batch.length) SV.rev = r.rev; }
      catch (e) { if (e.code !== "signed_out") { S.note = "You're offline. Changes are kept on this device and will sync when you're back."; render(); } break; }
    }
  })().finally(() => { flushing = null; });
  return flushing;
}

function setupServerMunin() {

const roadOff = document.createElement("canvas"); roadOff.width = RW; roadOff.height = RH;

function toss(from) {
  let h = $("tossHearth");
  if (!h) { h = document.createElement("canvas"); h.id = "tossHearth"; h.className = "roomcv tossh"; h.dataset.room = "life"; h.dataset.s = "2"; h.width = 142; h.height = 84; h.setAttribute("aria-hidden", "true"); document.body.appendChild(h); }

  const ball = document.createElement("canvas"); ball.width = 6; ball.height = 6; ball.className = "paperball"; document.body.appendChild(ball);
  const g = ball.getContext("2d"); [[1, 0], [2, 0], [3, 0], [0, 1], [1, 1], [3, 1], [4, 1], [0, 2], [2, 2], [3, 2], [4, 2], [5, 2], [0, 3], [1, 3], [2, 3], [4, 3], [5, 3], [1, 4], [2, 4], [3, 4], [4, 4], [2, 5], [3, 5]].forEach(([x, y], n) => { g.fillStyle = n % 4 === 0 ? "#c8b0d8" : "#f3e6ff"; g.fillRect(x, y, 1, 1); });
  const x0 = from ? from.left + Math.min(from.width, 60) / 2 : innerWidth / 2, y0 = from ? from.top + 6 : innerHeight / 2;
  const x1 = 16 + 38 * 2 - 9, y1 = innerHeight - 16 - 84 + 34 * 2 - 9, t0 = performance.now(), dur = 820;   // lands on the woodpile

    if (p < 1) requestAnimationFrame(step); else ball.remove();
  };

}

addEventListener("resize", () => { if (innerWidth === lastW) return; lastW = innerWidth; if ($("house") || $("roadBox")) { fitHouse(); render(); } if ($("scene")) fitScene(); });

// The road ahead: for each trail, the next waystone and the next real step toward it.
function roadAhead(sent) {

    const st = rd[k] || [], next = st.find(w => !w.done), doneN = st.filter(w => w.done).length;

    // which project is walking toward that waystone, and what's its next step?
    const cand = projects().filter(p => trailOf(p) === k).map(p => ({ p, s: nextStep(p), aims: next && threadOf(p).steps.some(x => x.kind === "stone" && x.w.id === next.id) }))
      .filter(x => x.s && x.s.kind !== "stone").sort((a, b) => (b.aims ? 1 : 0) - (a.aims ? 1 : 0) || (pickRank(a.s) - pickRank(b.s)) || (a.p.order ?? 99) - (b.p.order ?? 99));

    return `<div class="trow"><div class="th"><span class="tn" style="color:${T.col}">${esc(T.name)}</span><span class="pips">${pips}</span><span class="sub">${doneN}/${st.length}</span></div>

      ${c ? `<button class="tstep" data-go="${esc(hashFor.p(c.p.id))}"><img src="${objURL(c.p)}" alt=""><span><b>${esc(c.s.label)}</b><span class="sub">${esc(c.p.name)}</span></span><span class="chev">›</span></button>` : ""}</div>`;
  }).join("");
  return `<div class="card sending"><div class="lbl">${img("log")} The road ahead <span class="c">${sent.length ? `✦ ${sent.length} ${sent.length === 1 ? "lantern" : "lanterns"} today` : ""}</span><button class="ghost r" data-road>Edit</button></div>${rows}</div>`;

const pickRank = s => s && s.it ? ({ today: 0, week: 1 }[s.it.pick] ?? 2) : 3;

// Drawers: closed boxes you open one at a time, so a place never shows everything at once.

function list(arr, empty, o) { return arr.length ? arr.map(i => itemHTML(i, o)).join("") : (empty ? `<div class="empty">${empty}</div>` : ""); }
// All of a place's items, in the same order everywhere: what's next, what needs a decision, what's decided, what's known, what might be, what happened.
function sections(its, ctx) {

  const notes = its.filter(i => i.kind === "note" || i.kind === "link").sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || byNew(a, b));
  const ideas = its.filter(i => i.kind === "idea").sort(byNew), hist = its.filter(i => i.kind === "log").sort(byLogDate);

function pagesHTML(docs, ctx) {

  return `<h3 class="sec">${img("doc")} Pages <span class="r">${add}</span></h3>${docs.length ? `<div class="pages">${docs.map(pageCard).join("")}</div>` : `<div class="empty">Plans, roadmaps, briefs and long notes live here, and keep every old version. Nothing here yet.</div>`}`;

function pageCard(d) { return `<div class="pagecard" data-go="${esc(hashFor.doc(d.id))}"><div class="n">${d.pinned ? '<span class="pin">&#9733;</span> ' : ""}${esc(d.title)}${isNew(d) ? `<span class="tag new">new</span>` : ""}</div><div class="s">${esc(snip(d.body, 160))}</div><div class="w">${childPages(d).length ? `<b class="inn">${childPages(d).length} ${childPages(d).length === 1 ? "page" : "pages"} inside</b> · ` : ""}${(d.history || []).length ? (d.history.length + 1) + " versions · " : ""}updated ${fmtDate(d.updated || d.created)}</div></div>`; }

// ============================================================ a room

// The usual drawers for a set of items. Pass pagesCtx to include a Pages drawer.
function itemDrawers(its, ctx, pagesCtx, docs = []) {

  const q = its.filter(i => i.kind === "question" && !i.done).sort(byOld);
  const know = its.filter(i => ["note", "link", "decision"].includes(i.kind) || (i.kind === "question" && i.done)).sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || byNew(a, b));
  const ideas = its.filter(i => i.kind === "idea").sort(byNew), hist = [...its.filter(i => i.kind === "log"), ...done].sort((a, b) => (doneAt(b) || Date.parse(b.date || 0) || b.created) - (doneAt(a) || Date.parse(a.date || 0) || a.created));
  const boxes = [
    { id: "steps", name: "Steps", icon: "todo", n: todo.length, always: true, html: () => list(todo, "No open steps.") + `<form class="addline" data-add="${esc(ctx)}"><input type="text" placeholder="Add a step..."><button type="submit">Add</button></form>` },
    { id: "q", name: "Waiting on you", icon: "question", n: q.length, html: () => list(q, "") },

  boxes.push({ id: "ideas", name: "Someday", icon: "idea", n: ideas.length, html: () => list(ideas, "") });
  boxes.push({ id: "hist", name: "History", icon: "log", n: hist.length, html: () => list(hist.slice(0, 50), "") });

function woodpileHTML(wood) {

// ============================================================ markdown: short notes and full pages
function inline(s) {
  return s.replace(/`([^`]+)`/g, (m, c) => "\u0000" + btoa(unescape(encodeURIComponent(c))) + "\u0000")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[^"'>=])(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>')
    .replace(/\u0000([A-Za-z0-9+/=]*)\u0000/g, (m, b) => "<code>" + decodeURIComponent(escape(atob(b))) + "</code>");
}
function md(s) {   // short notes: paragraphs, bullets, bold, links
  const out = []; let ul = false;
  for (const raw of esc(s).split("\n")) {
    const line = inline(raw);
    const m = line.match(/^\s*[-*] (.*)/) || line.match(/^\s*\d+\. (.*)/);
    if (m) { if (!ul) { out.push("<ul>"); ul = true; } out.push("<li>" + m[1] + "</li>"); continue; }
    if (ul) { out.push("</ul>"); ul = false; }
    if (line.trim()) out.push("<p>" + line.replace(/^#+\s*/, "") + "</p>");
  }
  if (ul) out.push("</ul>");
  return out.join("");
}
function mdDoc(src) {   // full pages: headings, lists, tables, quotes, code, checkboxes
  const L = esc(src || "").split("\n"), out = []; let i = 0;
  const isTable = n => /^\s*\|.*\|\s*$/.test(L[n] || "") && /^\s*\|[\s:|-]+\|\s*$/.test(L[n + 1] || "");
  while (i < L.length) {
    const line = L[i];
    if (/^\s*```/.test(line)) { const buf = []; i++; while (i < L.length && !/^\s*```/.test(L[i])) buf.push(L[i++]); i++; out.push("<pre><code>" + buf.join("\n") + "</code></pre>"); continue; }
    let m = line.match(/^(#{1,4})\s+(.*)/); if (m) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
    if (isTable(i)) {
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      const head = cells(L[i]); i += 2; const rows = [];
      while (i < L.length && /^\s*\|.*\|\s*$/.test(L[i])) rows.push(cells(L[i++]));
      out.push(`<div class="tw"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`); continue;
    }
    if (/^\s*&gt;\s?/.test(line)) { const buf = []; while (i < L.length && /^\s*&gt;\s?/.test(L[i])) buf.push(inline(L[i++].replace(/^\s*&gt;\s?/, ""))); out.push("<blockquote>" + buf.join("<br>") + "</blockquote>"); continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
      const ordered = /^\s*\d+\./.test(line), tag = ordered ? "ol" : "ul", buf = [];
      while (i < L.length && /^\s*([-*]|\d+\.)\s+/.test(L[i])) {
        let t = L[i].replace(/^\s*([-*]|\d+\.)\s+/, ""), ind = (L[i].match(/^\s*/)[0].length >= 2) ? ' style="margin-left:18px"' : "";
        t = t.replace(/^\[( |x|X)\]\s*/, (m0, c) => `<span class="cb ${c.trim() ? "on" : ""}"></span>`);
        buf.push(`<li${ind}>${inline(t)}</li>`); i++;
      }
      out.push(`<${tag}>${buf.join("")}</${tag}>`); continue;
    }
    if (!line.trim()) { i++; continue; }
    const buf = [line]; i++;
    while (i < L.length && L[i].trim() && !/^(#{1,4}\s|\s*```|\s*([-*]|\d+\.)\s+|\s*&gt;|\s*\|)/.test(L[i])) buf.push(L[i++]);
    out.push("<p>" + buf.map(inline).join("<br>") + "</p>");
  }
  return out.join("");
}

const bookHint = () => MUNIN_AI && PREF.get("autofile", false) ? "Munin reads it right away and carries it to the right room. If he isn't sure, it waits in the Book of Shadows." : "It waits in the Book of Shadows until you, or Munin, send it to a room.";
function splitTitle(text) { const lines = text.split("\n"); let title = lines[0].replace(/^#+\s*/, "").trim(), body = lines.slice(1).join("\n").trim(); if (title.length > 140) { body = text; title = title.slice(0, 80).replace(/\s+\S*$/, "") + "..."; } return { title, body }; }

  if (text.length > 500 || /^#{1,3}\s/m.test(text)) return "doc";
  return /^(todo|to do|to-do|remember to|need to|i need to|i should)\b/i.test(text) ? "todo" : /\?\s*$/.test(title) ? "question" : link && text.replace(link, "").trim().length < 20 ? "link" : "note";
}
function addHere(text, kind, area, project) {
    if (kind === "auto") kind = guessKind(text);
  const { title, body } = splitTitle(text), link = (text.match(/https?:\/\/\S+/) || [""])[0];
  const id = newId(kind.slice(0, 1));

function guessArea(t) {
  if (/\bcoven\b(?! slice)|hexweaver|unmaking|necromancer|diviner/i.test(t)) return "coven";
  if (/stargazer|galax|universe sim/i.test(t)) return "stargazer";
  if (/school|oneonta|stony brook|class|degree|semester|enroll|professor|homework|exam|computer engineering/i.test(t)) return "school";
  if (/\bjob|resume|cover letter|interview|apply|application|dltracker|excel|\bsql\b|power ?bi|paycheck|retail/i.test(t)) return "jobs";
  if (/game|itch|orrery|star forge|hedge|witchbottle|constellation|potion|cloudflare|website|github|repo|playtest|shop|slice/i.test(t)) return "games";
  return "life";
}

function openSearch() {
  openSheet("search", `<h3>${img("search")} Find</h3><input type="search" id="sq" placeholder="Search rooms, projects, pages and notes..." autocomplete="off"><div id="sres"></div>`);
  let sel = 0;
  const run = () => {
    const q = $("sq").value.trim().toLowerCase(), w = q.split(/\s+/).filter(Boolean);
    if (!w.length) { $("sres").innerHTML = `<div class="sub" style="padding:6px">Try "hosting", "Shroom-Mother", "resume" or "computer engineering".</div>`; return; }
    const hit = s => { s = s.toLowerCase(); return w.every(x => s.includes(x)); };
    const res = [];
    for (const [k, R] of Object.entries(ROOMS)) if (hit(R.name + " " + R.what)) res.push({ t: R.name, w: R.what, k: "log", go: hashFor.room(k) });
    for (const p of projects()) if (hit([p.name, p.status, p.version, p.next, p.notes].join(" "))) res.push({ t: p.name, w: (ROOMS[p.area] || ROOMS.games).name + " · project", k: "library", go: hashFor.p(p.id) });
    for (const i of items().sort((a, b) => (a.kind === "doc" ? 0 : 1) - (b.kind === "doc" ? 0 : 1) || byNew(a, b))) if (hit([i.title, i.body, i.answer, KINDS[i.kind]].join(" "))) res.push({ t: i.title, w: KINDS[i.kind] + " · " + whereText(i), k: i.kind, item: i.id });
    sel = Math.min(sel, Math.max(0, res.length - 1));
    $("sres").innerHTML = res.length ? res.slice(0, 50).map((r, n) => `<div class="res ${n === sel ? "sel" : ""}" data-n="${n}"><img src="${icon(r.k)}" alt=""><div><div class="t">${hl(r.t, q)}</div><div class="w">${esc(r.w)}</div></div></div>`).join("") : `<div class="sub" style="padding:6px">Nothing matches. Try fewer words, or ask Munin.</div>`;
    $("sres").onclick = e => { const el = e.target.closest("[data-n]"); if (el) pick(res[+el.dataset.n]); };
    $("sq").onkeydown = e => { if (e.key === "ArrowDown") { sel = Math.min(res.length - 1, sel + 1); run(); e.preventDefault(); } else if (e.key === "ArrowUp") { sel = Math.max(0, sel - 1); run(); e.preventDefault(); } else if (e.key === "Enter" && res[sel]) pick(res[sel]); };
  };
  const pick = r => { closeSheet(); if (r.item) revealItem(r.item); else go(r.go); };
  $("sq").oninput = () => { sel = 0; run(); }; run(); setTimeout(() => $("sq").focus(), 50);
}

function revealInPlace(id) {

// ---- the thread: put a project's steps in order, from anywhere in the cottage, ending at a waystone
function openThread(pid) {
  const p = S.projects[pid]; if (!p) return;
  let refs = (Array.isArray(p.thread) && p.thread.length ? p.thread : threadOf(p).steps.map(s => s.ref)).slice();
  const label = r => { const x = resolve(r); if (!x) return null; return x.kind === "item" ? `${esc(x.label)}${x.proj && x.proj.id !== pid ? ` <span class="sub">· ${esc(x.proj.name)}</span>` : ""}${x.done ? ' <span class="sub">(done)</span>' : ""}` : x.kind === "stone" ? `<span class="flag" style="background:${TRAILS[x.trail].col}"></span>${esc(x.label)} <span class="sub">· waystone</span>` : x.kind === "project" ? `${esc(x.label)} <span class="sub">· project</span>` : `${esc(x.label)} <span class="sub">· a step to plan</span>`; };
  const todos = items().filter(i => i.kind === "todo" && !i.done).sort((a, b) => (a.project === pid ? 0 : 1) - (b.project === pid ? 0 : 1) || byPinOld(a, b));
  const stones = Object.entries(road()).filter(([k]) => TRAILS[k]).flatMap(([k, st]) => (st || []).map(w => ["w:" + k + ":" + w.id, TRAILS[k].name + ": " + w.title + (w.done ? " (reached)" : "")]));
  openSheet("thread", `<h3><img src="${objURL(p)}" alt="" style="width:36px;height:36px;image-rendering:pixelated"> The thread</h3>
    <div class="sub">The steps ${esc(p.name)} walks, in order, toward a waystone. Steps can live in other projects too, like the website's Cloudflare setup.</div>
    <div id="thRows"></div>
    <div class="card"><div class="lbl" style="font-size:18px">Add a step</div>
      <div class="addline" style="margin-top:0"><input type="text" id="thNew" placeholder="A new step for ${esc(p.name)}..."><button id="thNewBtn">Add</button></div>
      <label style="margin-top:8px">Or a step from anywhere<select id="thTodo"><option value="">Choose a to-do...</option>${todos.map(i => `<option value="i:${esc(i.id)}">${esc(snip(i.title, 70))} · ${esc(whereText(i))}</option>`).join("")}</select></label>
      <label style="margin-top:8px">Or a waystone<select id="thStone"><option value="">Choose a waystone...</option>${stones.map(([r, t]) => `<option value="${esc(r)}">${esc(t)}</option>`).join("")}</select></label></div>
    <div class="btns">${MUNIN_AI ? `<button id="thWeave">Munin, weave it</button>` : ""}<span class="sub" id="thStatus"></span><span class="spacer"></span><button class="ghost" id="thAuto">Back to automatic</button></div>
    <div class="btns"><button class="main" id="thSave">Save the thread</button><button id="thCancel">Cancel</button></div>`);
  const paint = () => { $("thRows").innerHTML = refs.length ? refs.map((r, n) => { const l = label(r); return l ? `<div class="stonerow"><span class="sub" style="width:18px">${n + 1}</span><span style="flex:1;min-width:0">${l}</span><button data-tu="${n}" ${n ? "" : "disabled"} aria-label="Move up">↑</button><button data-td="${n}" ${n < refs.length - 1 ? "" : "disabled"} aria-label="Move down">↓</button><button class="ember" data-tx="${n}" aria-label="Remove">×</button></div>` : ""; }).join("") : `<div class="empty">No steps yet.</div>`; };
  paint();
  $("thRows").onclick = e => { const u = e.target.closest("[data-tu]"), d = e.target.closest("[data-td]"), x = e.target.closest("[data-tx]");
    if (u) { const n = +u.dataset.tu; [refs[n - 1], refs[n]] = [refs[n], refs[n - 1]]; } else if (d) { const n = +d.dataset.td; [refs[n + 1], refs[n]] = [refs[n], refs[n + 1]]; } else if (x) refs.splice(+x.dataset.tx, 1); else return; paint(); };
  const addNew = () => { const t = $("thNew").value.trim(); if (!t) return; const nid = newId("t"); put("items", nid, { kind: "todo", title: t.slice(0, 200), body: "", area: p.area || "games", project: pid, link: "", done: false, pinned: false, created: Date.now(), by: "Sophia" }); const stoneAt = refs.findIndex(r => typeof r === "string" && r.startsWith("w:")); if (stoneAt >= 0) refs.splice(stoneAt, 0, "i:" + nid); else refs.push("i:" + nid); $("thNew").value = ""; paint(); };
  $("thNewBtn").onclick = addNew; $("thNew").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); addNew(); } };
  $("thTodo").onchange = e => { if (e.target.value && !refs.includes(e.target.value)) { const at = refs.findIndex(r => typeof r === "string" && r.startsWith("w:")); if (at >= 0) refs.splice(at, 0, e.target.value); else refs.push(e.target.value); paint(); } e.target.value = ""; };
  $("thStone").onchange = e => { if (e.target.value && !refs.includes(e.target.value)) { refs.push(e.target.value); paint(); } e.target.value = ""; };
  $("thAuto").onclick = () => { const d = { ...p }; delete d.thread; put("projects", pid, d); closeSheet(); toast("The thread follows its steps again"); };
  $("thSave").onclick = () => { put("projects", pid, { ...p, thread: refs }); closeSheet(); toast("Thread saved"); };
  $("thCancel").onclick = closeSheet;
  if ($("thWeave")) $("thWeave").onclick = async () => { $("thStatus").textContent = "Munin is weaving..."; $("thWeave").disabled = true;
    try { const out = await weave(p); if (out && out.length) { refs = out; paint(); $("thStatus").innerHTML = brainBadge("hearth") + " wove this thread. Save it if it looks right."; } else $("thStatus").textContent = "Munin couldn't find a thread this time."; }
    catch (e) { $("thStatus").textContent = "Munin couldn't weave it this time."; } $("thWeave").disabled = false; };
}

// ---- tie two things together: they show up on each other's cards
